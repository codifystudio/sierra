<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sierra</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark">

<!-- ═══ TAB STRIP (сверху — как в Chrome) ═══ -->
<div class="tab-strip" id="tabStrip">
  <div class="tabs" id="tabsContainer"></div>
  <button class="new-tab-btn" onclick="newTab()" title="Новая вкладка (Ctrl+T)">+</button>
</div>

<!-- ═══ TOOLBAR (под вкладками — навигация + адресная строка) ═══ -->
<div class="toolbar">
  <button class="nav-btn" id="btnBack" onclick="goBack()" title="Назад (Alt+←)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <button class="nav-btn" id="btnForward" onclick="goForward()" title="Вперёд (Alt+→)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
  <button class="nav-btn" id="btnRefresh" onclick="refresh()" title="Обновить (F5)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
  </button>
  <button class="nav-btn" id="btnHome" onclick="goHome()" title="Домой (Alt+Home)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </button>

  <input type="text" class="address-bar" id="addressBar"
         placeholder="Введите URL или поисковый запрос..."
         onkeydown="onAddressKey(event)"
         onfocus="onAddressFocus()"
         onblur="onAddressBlur()">

  <button class="nav-btn" id="btnBookmark" onclick="toggleBookmark()" title="Добавить в закладки (Ctrl+D)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
  </button>
  <button class="nav-btn menu-btn" id="btnMenu" onclick="toggleMenu(event)" title="Меню">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</div>

<!-- ═══ MENU DROPDOWN ═══ -->
<div class="menu-dropdown" id="menuDropdown">
  <div class="menu-item" onclick="newTab()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Новая вкладка</span><span class="menu-shortcut">Ctrl+T</span>
  </div>
  <div class="menu-item" onclick="showBookmarks()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span>Закладки</span>
  </div>
  <div class="menu-item" onclick="showHistory()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    <span>История</span><span class="menu-shortcut">Ctrl+H</span>
  </div>
  <div class="menu-separator"></div>
  <div class="menu-item" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <span>Сменить тему</span><span class="menu-shortcut">Ctrl+Shift+T</span>
  </div>
  <div class="menu-item" onclick="clearHistory()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    <span>Очистить историю</span>
  </div>
</div>

<!-- ═══ START PAGE (показывается на новых вкладках) ═══ -->
<div class="start-page" id="startPage">
  <div class="start-logo">Sierra</div>
  <input type="text" class="start-search" id="startSearch"
         placeholder="Поиск в DuckDuckGo или введите URL"
         onkeydown="onStartSearchKey(event)">
  <div class="start-shortcuts" id="startShortcuts">
    <div class="shortcut" onclick="navigate('https://github.com')">
      <div class="shortcut-icon" style="color:#fff;background:#24292e">G</div>
      <div class="shortcut-name">GitHub</div>
    </div>
    <div class="shortcut" onclick="navigate('https://duckduckgo.com')">
      <div class="shortcut-icon" style="color:#fff;background:#de5833">D</div>
      <div class="shortcut-name">DuckDuckGo</div>
    </div>
    <div class="shortcut" onclick="navigate('https://youtube.com')">
      <div class="shortcut-icon" style="color:#fff;background:#ff0000">Y</div>
      <div class="shortcut-name">YouTube</div>
    </div>
    <div class="shortcut" onclick="navigate('https://wikipedia.org')">
      <div class="shortcut-icon" style="color:#fff;background:#000">W</div>
      <div class="shortcut-name">Wikipedia</div>
    </div>
    <div class="shortcut" onclick="navigate('https://news.ycombinator.com')">
      <div class="shortcut-icon" style="color:#ff6600;background:#f6f6ef">H</div>
      <div class="shortcut-name">Hacker News</div>
    </div>
    <div class="shortcut" onclick="navigate('https://reddit.com')">
      <div class="shortcut-icon" style="color:#fff;background:#ff4500">R</div>
      <div class="shortcut-name">Reddit</div>
    </div>
    <div class="shortcut" onclick="navigate('https://twitter.com')">
      <div class="shortcut-icon" style="color:#fff;background:#1da1f2">X</div>
      <div class="shortcut-name">X (Twitter)</div>
    </div>
    <div class="shortcut" onclick="navigate('https://stackoverflow.com')">
      <div class="shortcut-icon" style="color:#fff;background:#f48024">S</div>
      <div class="shortcut-name">Stack Overflow</div>
    </div>
  </div>
  <div class="hint">Ctrl+T — новая вкладка · Ctrl+L — адресная строка · Ctrl+W — закрыть</div>
</div>

<!-- ═══ STATUS BAR ═══ -->
<div class="status-bar">
  <span id="statusText">Загрузка…</span>
  <div class="progress" id="progress" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

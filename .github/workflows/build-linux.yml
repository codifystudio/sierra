name: Build Sierra for Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: Build Linux binary (WebKitGTK)

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 libgtk-3-0 libjavascriptcoregtk-4.1-0 \
            libsoup-3.0-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libharfbuzz-icu0 libhyphen0 libwpe-1.0-1 libwpebackend-fdo-1.0-1 \
            libmanette-0.2-0 libenchant-2-2 libsecret-1-0 libnotify4 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libsoup2.4-dev \
            libssl-dev librsvg2-dev libxslt1-dev libxml2-dev \
            libsqlite3-dev libx11-dev libxcb1-dev libxcomposite-dev \
            libxdamage-dev libxrandr-dev libxfixes-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxtst-dev libatk1.0-dev \
            libatk-bridge2.0-dev libpango1.0-dev libcairo2-dev \
            libgdk-pixbuf2.0-dev libharfbuzz-dev libepoxy-dev \
            libsystemd-dev libatspi2.0-dev upx-ucl

      - name: 🔨 Build binary
        run: |
          cd src-tauri
          cargo build --release
          cp target/release/sierra ../sierra

      - name: 📊 Show size
        run: ls -lh sierra

      - name: 🗜️ Compress with UPX
        run: |
          upx --best --lzma sierra
          ls -lh sierra

      - name: 📦 Package into zip
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          ZIP="sierra-$TAG-linux-x64.zip"
          zip "$ZIP" sierra
          ls -lh "$ZIP"

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sierra-linux-zip
          path: sierra-*.zip
          retention-days: 90

      - name: 🚀 Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP=$(ls sierra-*.zip | head -1)
          echo "Uploading $ZIP to release $TAG"
          gh release upload "$TAG" "$ZIP" --clobber

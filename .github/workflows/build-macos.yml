name: Build Sierra for macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    name: Build macOS binary (WebKit, wry)

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🔨 Build binary
        run: |
          cd src-tauri
          cargo build --release
          cp target/release/sierra ../sierra

      - name: 📊 Show size
        run: ls -lh sierra

      - name: 📦 Package into zip
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          ZIP="sierra-$TAG-macos-x64.zip"
          zip "$ZIP" sierra

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sierra-macos-zip
          path: sierra-*.zip
          retention-days: 90

      - name: 🚀 Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP=$(ls sierra-*.zip | head -1)
          gh release upload "$TAG" "$ZIP" --clobber

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Smoke test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 libgtk-3-0 libjavascriptcoregtk-4.1-0 \
            libsoup-3.0-0 libsoup2.4-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libssl-dev librsvg2-dev \
            libxslt1-dev libxml2-dev libsqlite3-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxfixes-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxtst-dev libatk1.0-dev libatk-bridge2.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev \
            libharfbuzz-dev libepoxy-dev libsystemd-dev libatspi2.0-dev

      - name: 🧪 cargo check
        run: |
          cd src-tauri
          cargo check
          echo "Smoke test PASSED"

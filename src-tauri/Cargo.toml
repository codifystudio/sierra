[package]
name = "sierra"
version = "5.0.0"
edition = "2021"
description = "Sierra — лёгкий браузер на Rust (wry + tao)"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

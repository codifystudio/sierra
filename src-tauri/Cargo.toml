[package]
name = "sierra"
version = "4.0.0"
description = "Sierra — лёгкий, стильный браузер на Rust"
authors = ["vefyz"]
license = "MIT"
repository = "https://github.com/vefyz/sierra"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
